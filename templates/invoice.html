<div class="min-h-screen bg-white p-10 font-sans text-slate-800">
  <header class="flex items-start justify-between border-b-4 border-indigo-600 pb-6">
    <div>
      <h1 class="text-4xl font-bold text-indigo-600">INVOICE</h1>
      <p class="mt-1 text-sm text-slate-500">#{{ invoice.number }}</p>
    </div>
    <div class="text-right">
      <p class="text-lg font-semibold">{{ company.name }}</p>
      <p class="text-sm text-slate-500">{{ company.email }}</p>
    </div>
  </header>

  <section class="mt-8 grid grid-cols-2 gap-6">
    <div class="rounded-lg bg-slate-50 p-4">
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Billed to</p>
      <p class="mt-1 font-medium">{{ customer.name }}</p>
      <p class="text-sm text-slate-500">{{ customer.email }}</p>
    </div>
    <div class="rounded-lg bg-slate-50 p-4 text-right">
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Issued</p>
      <p class="mt-1 font-medium">{{ invoice.date }}</p>
    </div>
  </section>

  <table class="mt-8 w-full text-left text-sm">
    <thead>
      <tr class="bg-indigo-600 text-white">
        <th class="rounded-l px-4 py-3 font-semibold">Description</th>
        <th class="rounded-r px-4 py-3 text-right font-semibold">Amount</th>
      </tr>
    </thead>
    <tbody>
      <tr class="break-inside-avoid border-b border-slate-200">
        <td class="px-4 py-3">{{ item.description }}</td>
        <td class="px-4 py-3 text-right">{{ item.amount }}</td>
      </tr>
    </tbody>
  </table>

  <div class="mt-6 flex justify-end">
    <div class="w-64 rounded-lg bg-indigo-50 p-4">
      <div class="flex justify-between text-lg font-bold text-indigo-600">
        <span>Total</span>
        <span>{{ invoice.total }}</span>
      </div>
    </div>
  </div>

  <footer class="mt-12 border-t border-slate-200 pt-4 text-center text-xs text-slate-400">
    Thank you for your business.
  </footer>
</div>
